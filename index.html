<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#07070d;--card:#111119;--accent:#7c6aff;--accent-g:rgba(124,106,255,.25);--green:#00e4b8;--orange:#ff9052;--red:#ff5263;--blue:#4ea4f6;--text:#eceaf5;--t2:#9e99b5;--t3:#5f5b74;--border:#242436;--inp:#191926;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,'Helvetica Neue',sans-serif;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body{padding-top:var(--sat)}
#app{max-width:480px;margin:0 auto;padding-bottom:calc(76px + var(--sab));min-height:100vh}
.hdr{padding:14px 20px 10px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#0e0e18,transparent);position:sticky;top:0;z-index:50;backdrop-filter:blur(16px)}
.hdr-row{display:flex;align-items:center;gap:10px}
.hdr-between{justify-content:space-between}
.back{background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;padding:4px;line-height:1}
.logo{font-size:20px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-sm{font-size:17px}
.sub{font-size:10px;color:var(--t3);letter-spacing:.5px;text-transform:uppercase;margin-top:1px}
.free-tag{display:inline-block;background:rgba(0,228,184,.12);color:var(--green);font-size:9px;font-weight:700;padding:2px 7px;border-radius:8px;margin-left:6px;vertical-align:middle}
.cd{background:var(--card);border-radius:14px;padding:16px;margin:8px 16px;border:1px solid var(--border)}
.cd:active{transform:scale(.985)}
.cd-row{display:flex;justify-content:space-between;align-items:center}
.sum-row{display:flex;gap:8px;padding:10px 16px}
.sum-cd{flex:1;background:var(--card);border-radius:14px;padding:14px;text-align:center;border:1px solid var(--border);position:relative;overflow:hidden}
.sum-cd::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.sum-cd.personal::before{background:linear-gradient(90deg,var(--green),transparent)}
.sum-cd.business::before{background:linear-gradient(90deg,var(--orange),transparent)}
.sum-lb{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.sum-val{font-size:21px;font-weight:700}
.sum-ct{font-size:10px;color:var(--t3);margin-top:2px}
.btn{border:none;border-radius:11px;padding:13px 22px;font-size:14px;font-weight:600;cursor:pointer;width:100%;font-family:inherit}
.btn-a{background:var(--accent);color:#fff;box-shadow:0 3px 16px var(--accent-g)}
.btn-g{background:var(--green);color:#000}
.btn-r{background:var(--red);color:#fff}
.btn-o{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn-s{padding:10px 15px;font-size:12px;border-radius:9px}
.btn:disabled{opacity:.35}
.btn-w{padding:4px 16px}
.inp,.ta{background:var(--inp);border:1px solid var(--border);border-radius:9px;padding:11px 13px;color:var(--text);font-size:14px;width:100%;outline:none;font-family:inherit}
.inp:focus,.ta:focus{border-color:var(--accent)}
.ta{min-height:100px;resize:vertical;line-height:1.6}
.lb{font-size:11px;color:var(--t3);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.up-zone{text-align:center;padding:36px 20px;cursor:pointer;border:2px dashed var(--border);border-radius:14px;background:var(--card)}
.img-pre{position:relative}
.img-pre img{width:100%;border-radius:11px;max-height:280px;object-fit:contain;background:var(--inp)}
.img-rm{position:absolute;top:6px;right:6px;background:var(--red);color:#fff;border:none;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
.badge{display:inline-block;padding:2px 9px;border-radius:16px;font-size:10px;font-weight:600}
.badge-p{background:rgba(0,228,184,.12);color:var(--green)}
.badge-b{background:rgba(255,144,82,.12);color:var(--orange)}
.badge-sync{background:rgba(78,164,246,.12);color:var(--blue)}
.badge-nosync{background:rgba(255,82,99,.12);color:var(--red)}
.e-name{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.e-meta{font-size:11px;color:var(--t3);margin-top:2px}
.e-amt{font-size:16px;font-weight:700}
.dt-r{display:flex;justify-content:space-between;padding:3px 0;font-size:12px}
.dt-r .dl{color:var(--t3)}
.dt-total{border-top:1px solid var(--border);padding-top:6px;margin-top:4px}
.fg{display:flex;flex-direction:column;gap:10px}
.fr{display:flex;gap:8px}
.fr>div{flex:1}
.sec-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px}
.sec-t{font-size:14px;font-weight:600}
.sec-link{background:none;border:none;color:var(--accent);font-size:12px;cursor:pointer;font-weight:600;font-family:inherit}
.flt-row{padding:10px 16px 0;display:flex;gap:6px;align-items:center}
.flt-total{margin-left:auto;font-size:13px;font-weight:700}
.tabs{display:flex;gap:6px}
.tab{padding:7px 16px;border-radius:18px;font-size:12px;font-weight:600;border:none;cursor:pointer;background:transparent;color:var(--t2);font-family:inherit}
.tab.on{background:var(--accent);color:#fff}
.set-sec{padding:14px 16px}
.set-box{padding:12px;background:var(--inp);border-radius:10px;font-size:11px;color:var(--t2);line-height:1.8;margin-top:12px}
.set-box strong{color:var(--text)}
.api-row{display:flex;gap:6px}
.api-row .inp{flex:1;font-size:12px}
.api-st{font-size:11px;margin-top:5px}
.api-st.ok{color:var(--green)}
.api-st.no{color:var(--orange)}
.step-bar{display:flex;align-items:center;padding:14px 20px 4px;gap:4px}
.step-dot{width:8px;height:8px;border-radius:50%;background:var(--border);flex-shrink:0}
.step-dot.done{background:var(--green)}
.step-dot.active{background:var(--accent);box-shadow:0 0 8px var(--accent-g);width:10px;height:10px}
.step-line{flex:1;height:2px;background:var(--border)}
.step-line.done{background:var(--green)}
.step-label{font-size:11px;color:var(--t3);text-align:center;padding:0 16px 8px}
.folder-grid{display:flex;gap:12px;padding:0 16px}
.folder-btn{flex:1;padding:28px 12px;border-radius:16px;border:2px solid var(--border);background:var(--card);cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.folder-btn:active{transform:scale(.96)}
.folder-btn .f-icon{font-size:36px}
.folder-btn .f-label{font-size:16px;font-weight:700}
.folder-btn .f-sub{font-size:11px;color:var(--t3)}
.folder-btn.personal{border-color:rgba(0,228,184,.25)}
.folder-btn.business{border-color:rgba(255,144,82,.25)}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px}
.cat-btn{padding:16px 10px;border-radius:12px;border:1.5px solid var(--border);background:var(--card);cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:5px}
.cat-btn:active{transform:scale(.96);border-color:var(--accent)}
.cat-btn .c-icon{font-size:22px}
.cat-btn .c-label{font-size:12px;font-weight:600;line-height:1.3}
.cat-btn .c-en{font-size:10px;color:var(--t3)}
.sync-bar{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px;font-size:11px;font-weight:500}
.sync-bar.synced{background:rgba(0,228,184,.08);color:var(--green)}
.sync-bar.unsynced{background:rgba(255,144,82,.08);color:var(--orange)}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(10,10,16,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:7px 0 calc(6px + var(--sab));z-index:100}
.nb{background:none;border:none;color:var(--t3);font-size:9px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;padding:4px 12px}
.nb.on{color:var(--accent)}
.nb svg{width:20px;height:20px}
.nb-add{background:var(--accent);border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;margin-top:-14px;box-shadow:0 3px 16px var(--accent-g)}
.toast{position:fixed;top:calc(16px + var(--sat));left:50%;transform:translateX(-50%);padding:9px 24px;border-radius:18px;font-size:13px;font-weight:600;z-index:999;white-space:nowrap}
.toast-ok{background:var(--green);color:#000}
.toast-err{background:var(--red);color:#fff}
.toast-info{background:var(--blue);color:#fff}
.proc-box{text-align:center;padding:20px 0}
.proc-box .spin{display:inline-block;width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.proc-box .proc-txt{font-size:12px;color:var(--t2);margin-top:8px}
</style>
</head>
<body>
<div id="app"><div style="display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:12px"><div style="font-size:40px">📊</div><div style="color:#9e99b5">加载中...</div></div></div>
<script>
var PCATS=[{id:"personal-dining",icon:"\u{1F37D}\u{FE0F}",zh:"\u5916\u98DF",en:"Dining Out"},{id:"personal-grocery",icon:"\u{1F6D2}",zh:"Grocery",en:"Groceries"},{id:"personal-entertain",icon:"\u{1F3AC}",zh:"\u5A31\u4E50",en:"Entertainment"},{id:"personal-daily",icon:"\u{1F9F4}",zh:"\u65E5\u5E38",en:"Daily Essentials"},{id:"personal-rent",icon:"\u{1F3E0}",zh:"\u79DF\u91D1",en:"Rent"},{id:"personal-travel",icon:"\u2708\u{FE0F}",zh:"\u65C5\u6E38",en:"Travel"},{id:"personal-gas",icon:"\u26FD",zh:"\u4EA4\u901A/\u6CB9\u8D39",en:"Gas & Transport"},{id:"personal-health",icon:"\u{1F3E5}",zh:"\u533B\u7597",en:"Health"},{id:"personal-other",icon:"\u{1F4CC}",zh:"\u5176\u4ED6",en:"Other"}];
var BCATS=[{id:"business-legal",icon:"\u2696\u{FE0F}",zh:"\u5F8B\u5E08\u8D39",en:"Legal"},{id:"business-supplies",icon:"\u{1F527}",zh:"\u6750\u6599/\u8BBE\u5907",en:"Supplies & Equipment"},{id:"business-software",icon:"\u{1F4BB}",zh:"\u8F6F\u4EF6\u8D39\u7528",en:"Software"},{id:"business-facility",icon:"\u{1F3E2}",zh:"\u573A\u5730\u8D39",en:"Facility"},{id:"business-payroll",icon:"\u{1F4B0}",zh:"\u5DE5\u8D44",en:"Payroll"},{id:"business-income",icon:"\u{1F4C8}",zh:"\u6536\u5165",en:"Income"},{id:"business-marketing",icon:"\u{1F4E3}",zh:"\u8425\u9500/\u5E7F\u544A",en:"Marketing"},{id:"business-insurance",icon:"\u{1F6E1}\u{FE0F}",zh:"\u4FDD\u9669",en:"Insurance"},{id:"business-travel",icon:"\u{1F9F3}",zh:"\u5DEE\u65C5",en:"Business Travel"},{id:"business-other",icon:"\u{1F4CC}",zh:"\u5176\u4ED6",en:"Other"}];
var ALLC=PCATS.concat(BCATS);
function cf(id){for(var i=0;i<ALLC.length;i++)if(ALLC[i].id===id)return ALLC[i];return null}
function cfl(id){var c=cf(id);if(!c)return id||"";return(id.indexOf("personal")===0?"\u4E2A\u4EBA":"\u5546\u7528")+" \u203A "+c.zh}

function lg(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function ls(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function esc(s){if(!s)return"";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function td(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

var S={view:"home",entries:lg("re-e")||[],sheetUrl:lg("re-s")||"",gemKey:lg("re-gk")||"",
  step:1,mode:"photo",imgPrev:null,imgB64:null,imgMime:null,proc:false,procMsg:"",
  txtIn:"",form:{merchant:"",date:"",total:"",tax:"",note:""},
  folder:null,cat:null,detail:null,filter:"all",toast:null,tt:"ok"};
function sv(){ls("re-e",S.entries)}
function tt(m,t){S.toast=m;S.tt=t||"ok";R();setTimeout(function(){S.toast=null;R()},2600)}
function ra(){S.step=1;S.mode="photo";S.imgPrev=null;S.imgB64=null;S.imgMime=null;S.proc=false;S.procMsg="";S.txtIn="";S.form={merchant:"",date:"",total:"",tax:"",note:""};S.folder=null;S.cat=null}

// ============================================================
// GEMINI AI PARSE (free, no cost)
// ============================================================
function gemParse(isImage){
  if(!S.gemKey){S.view="settings";R();tt("\u8BF7\u5148\u8BBE\u7F6E Gemini API Key","err");return}
  S.proc=true;S.procMsg="\u{1F916} AI \u89E3\u6790\u4E2D...";R();

  var prompt='You are a receipt parser. Extract: merchant name, date, total amount, tax. Return ONLY valid JSON, no markdown. Format: {"merchant":"name","date":"YYYY-MM-DD","total":0.00,"tax":0.00} If date unclear use '+td()+'. Return JSON only, nothing else.';

  var parts=[];
  if(isImage&&S.imgB64){
    parts.push({inlineData:{mimeType:S.imgMime||"image/jpeg",data:S.imgB64}});
    parts.push({text:"Parse this receipt image. "+prompt});
  }else{
    parts.push({text:'Parse this receipt text: "'+S.txtIn+'". '+prompt});
  }

  var url="https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key="+S.gemKey;

  fetch(url,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({contents:[{parts:parts}]})
  }).then(function(r){return r.json()}).then(function(data){
    S.proc=false;
    if(data.error){
      tt("API\u9519\u8BEF: "+(data.error.message||"unknown").substring(0,50),"err");R();return;
    }
    try{
      var txt="";
      if(data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts){
        for(var i=0;i<data.candidates[0].content.parts.length;i++){
          if(data.candidates[0].content.parts[i].text)txt+=data.candidates[0].content.parts[i].text;
        }
      }
      var clean=txt.replace(/```json/g,"").replace(/```/g,"").trim();
      var res=JSON.parse(clean);
      S.form={merchant:res.merchant||"",date:res.date||td(),total:res.total||"",tax:res.tax||"",note:""};
      S.step=2;
    }catch(e){
      console.error("Parse error:",e,"Raw:",txt);
      tt("\u89E3\u6790\u5931\u8D25\uFF0C\u8BF7\u91CD\u8BD5","err");
    }
    R();
  }).catch(function(e){
    S.proc=false;
    console.error(e);
    tt("\u7F51\u7EDC\u9519\u8BEF\uFF0C\u8BF7\u91CD\u8BD5","err");R();
  });
}

function parseTxt(){
  var t=S.txtIn.trim();if(!t){tt("\u8BF7\u8F93\u5165","err");return}
  gemParse(false);
}

// ============================================================
// SYNC, DELETE, CSV (unchanged)
// ============================================================
function syn(entry){if(!S.sheetUrl)return Promise.resolve(false);return fetch(S.sheetUrl,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({type:entry.folder,date:entry.date,merchant:entry.merchant||"",category:cfl(entry.cat),items:entry.note||"",tax:entry.tax||0,total:entry.total||0})}).then(function(){return true}).catch(function(){return false})}
function cSave(){sfF();var e={id:String(Date.now()),merchant:S.form.merchant,date:S.form.date,total:parseFloat(S.form.total)||0,tax:parseFloat(S.form.tax)||0,note:S.form.note,folder:S.folder,cat:S.cat,ts:new Date().toISOString(),synced:false};syn(e).then(function(ok){e.synced=ok;S.entries.unshift(e);sv();if(ok)tt("\u5DF2\u4FDD\u5B58 & \u540C\u6B65 \u2713");else if(!S.sheetUrl)tt("\u5DF2\u4FDD\u5B58","info");else tt("\u5DF2\u4FDD\u5B58\uFF0C\u540C\u6B65\u5931\u8D25","err");ra();S.view="home";R()})}
function rSyn(id){var e=null;for(var i=0;i<S.entries.length;i++)if(S.entries[i].id===id){e=S.entries[i];break}if(!e)return;syn(e).then(function(ok){if(ok){e.synced=true;sv();tt("\u540C\u6B65\u6210\u529F \u2713")}else tt("\u5931\u8D25","err");R()})}
function synAll(){if(!S.sheetUrl){tt("\u8BF7\u5148\u8BBE\u7F6ESheet","err");return}var u=[];for(var i=0;i<S.entries.length;i++)if(!S.entries[i].synced)u.push(S.entries[i]);if(!u.length){tt("\u5DF2\u5168\u90E8\u540C\u6B65","info");return}var done=0,tot=u.length;function nx(idx){if(idx>=u.length){sv();tt("\u540C\u6B65 "+done+"/"+tot);R();return}syn(u[idx]).then(function(ok){if(ok){u[idx].synced=true;done++}nx(idx+1)})}nx(0)}
function delE(id){if(!confirm("\u786E\u5B9A\u5220\u9664\uFF1F"))return;var n=[];for(var i=0;i<S.entries.length;i++)if(S.entries[i].id!==id)n.push(S.entries[i]);S.entries=n;sv();tt("\u5DF2\u5220\u9664");S.detail=null;S.view="history";R()}
function exCSV(){var f=S.filter==="all"?S.entries:S.entries.filter(function(e){return e.folder===S.filter});if(!f.length){tt("\u6CA1\u6709\u6570\u636E","err");return}var h="\u65E5\u671F,\u5546\u5BB6,\u7C7B\u578B,\u5206\u7C7B,\u5907\u6CE8,\u7A0E\u8D39,\u603B\u8BA1,\u5DF2\u540C\u6B65";var rows=[];for(var i=0;i<f.length;i++){var e=f[i];rows.push(e.date+","+(e.merchant||"").replace(/,/g," ")+","+e.folder+","+cfl(e.cat)+","+(e.note||"").replace(/[,\n]/g," ")+","+(e.tax||0)+","+e.total+","+(e.synced?"\u662F":"\u5426"))}var csv="\uFEFF"+h+"\n"+rows.join("\n");var blob=new Blob([csv],{type:"text/csv;charset=utf-8"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="receipts_"+td()+".csv";a.click();tt("CSV\u5DF2\u5BFC\u51FA")}

function hImg(){
  var inp=document.createElement("input");inp.type="file";
  inp.onchange=function(e){var f=e.target.files[0];if(!f)return;
    if(f.type&&f.type.indexOf("image")===-1){alert("\u8BF7\u9009\u62E9\u56FE\u7247");return}
    var r=new FileReader();
    r.onload=function(ev){
      S.imgPrev=ev.target.result;
      S.imgMime=f.type||"image/jpeg";
      S.imgB64=ev.target.result.split(",")[1];
      R();
      gemParse(true);
    };r.readAsDataURL(f)};inp.click()}

function sfF(){var ids=["f-m","f-d","f-t","f-tx","f-n"];var keys=["merchant","date","total","tax","note"];for(var i=0;i<ids.length;i++){var el=document.getElementById(ids[i]);if(el)S.form[keys[i]]=el.value}}
function gBack(){sfF();if(S.step===5)S.step=4;else if(S.step===4){S.step=3;S.cat=null}else if(S.step===3){S.step=2;S.folder=null}else if(S.step===2)S.step=1;R()}

// ============================================================
// RENDER
// ============================================================
